name: jert_mobile
description: JERT Infrastructure Wallet

publish_to: 'none'

version: 1.1.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  reown_appkit: ^1.8.3
  app_links: ^6.3.2
  url_launcher: ^6.2.5

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/app_icon/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/app_icon/jert_app_icon.png"
    background_color: "#08111A"
    theme_color: "#2CF6FF"
  image_path: "assets/app_icon/jert_app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#08111A"
  image: assets/app_icon/jert_splash_logo.png

  android_12:
    color: "#08111A"
    image: assets/app_icon/jert_splash_logo.png

  web: false